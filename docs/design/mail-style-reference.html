<title>Dealflow Mail View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: mail-client shell. 64px header with a pill search; 256px nav rail (queues, labels, channels); the list or the open conversation sits in one rounded white surface on a tinted ground. Jev's priorities are the inbox tabs. */
:root{
  --bg:#f6f8fc; --surface:#ffffff; --fg:#1f1f1f; --fg-2:#444746; --fg-3:#747775;
  --line:rgba(100,121,143,.16); --line-2:#c4c7c5; --hover:rgba(68,71,70,.08);
  --nav-active:#d3e3fd; --nav-active-fg:#041e49;
  --primary:#0b57d0; --on-primary:#ffffff; --primary-container:#c2e7ff; --on-primary-container:#001d35;
  --row-read:#f2f6fc; --row-unread:#ffffff; --row-checked:#c2dbff;
  --row-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --search-bg:#e9eef6; --search-focus:#ffffff; --search-shadow:0 1px 1px rgba(65,69,73,.3),0 1px 3px 1px rgba(65,69,73,.15);
  --cta-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --menu-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);
  --composer-shadow:0 1px 2px rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);
  --jev-bg:#eef3fc; --jev-edge:rgba(11,87,208,.18);
  --review-bg:#fff4d6; --review-fg:#5c4300;
  --star:#e8a600; --nudge:#b05b00; --av-fg:#ffffff; --chip-on-fg:#ffffff;
  --toast-bg:#303030; --toast-fg:#f2f2f2; --toast-link:#a8c7fa;
  --scrim:rgba(32,33,36,.4); --focus:#0b57d0; --logo-bg:#e3eaf5;
  --tier-P0:#d93025; --tier-P1:#e37400; --tier-P2:#1a73e8; --tier-P3:#80868b;

  --l-default-bg:#e8eaed; --l-default-fg:#3c4043; --l-default-dot:#9aa0a6;
  --l-gray-bg:#e3e3e3; --l-gray-fg:#3c3c3c; --l-gray-dot:#80868b;
  --l-brown-bg:#f0dfd6; --l-brown-fg:#4a2a1a; --l-brown-dot:#9a6b52;
  --l-orange-bg:#ffdcc2; --l-orange-fg:#5a2a00; --l-orange-dot:#e8710a;
  --l-yellow-bg:#ffefc2; --l-yellow-fg:#4a3500; --l-yellow-dot:#e8a600;
  --l-green-bg:#c4eed0; --l-green-fg:#0a3818; --l-green-dot:#188038;
  --l-blue-bg:#d3e3fd; --l-blue-fg:#041e49; --l-blue-dot:#1a73e8;
  --l-purple-bg:#eaddff; --l-purple-fg:#4f378b; --l-purple-dot:#8e63ce;
  --l-pink-bg:#ffd8e4; --l-pink-fg:#5d1133; --l-pink-dot:#d01884;
  --l-red-bg:#fbd3d0; --l-red-fg:#601410; --l-red-dot:#d93025;

  --font:"Roboto",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131314; --surface:#1e1f20; --fg:#e3e3e3; --fg-2:#c4c7c5; --fg-3:#8e918f;
    --line:rgba(255,255,255,.08); --line-2:#444746; --hover:rgba(227,227,227,.08);
    --nav-active:#004a77; --nav-active-fg:#c2e7ff;
    --primary:#a8c7fa; --on-primary:#062e6f; --primary-container:#004a77; --on-primary-container:#c2e7ff;
    --row-read:#1e1f20; --row-unread:#28292b; --row-checked:#0b3a63;
    --row-shadow:inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.6);
    --search-bg:#282a2c; --search-focus:#303134; --search-shadow:0 1px 3px rgba(0,0,0,.6);
    --cta-shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.3);
    --menu-shadow:0 2px 6px 2px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.6);
    --composer-shadow:0 1px 2px rgba(0,0,0,.6),0 2px 6px 2px rgba(0,0,0,.35);
    --jev-bg:#1c2633; --jev-edge:rgba(168,199,250,.2);
    --review-bg:#3d3013; --review-fg:#ffdf99;
    --star:#f6c344; --nudge:#ffb870; --av-fg:#1f1f1f; --chip-on-fg:#1f1f1f;
    --toast-bg:#e3e3e3; --toast-fg:#1f1f1f; --toast-link:#0b57d0;
    --scrim:rgba(0,0,0,.55); --focus:#a8c7fa; --logo-bg:#2a2f38;
    --tier-P0:#f28b82; --tier-P1:#ffb870; --tier-P2:#7cacf8; --tier-P3:#9aa0a6;
    --l-default-bg:#3c4043; --l-default-fg:#e8eaed; --l-default-dot:#9aa0a6;
    --l-gray-bg:#444746; --l-gray-fg:#e3e3e3; --l-gray-dot:#9aa0a6;
    --l-brown-bg:#5a3a28; --l-brown-fg:#f0dfd6; --l-brown-dot:#c49a83;
    --l-orange-bg:#6e3600; --l-orange-fg:#ffdcc2; --l-orange-dot:#ffb870;
    --l-yellow-bg:#5c4300; --l-yellow-fg:#ffefc2; --l-yellow-dot:#fdd663;
    --l-green-bg:#0f5223; --l-green-fg:#c4eed0; --l-green-dot:#6dd58c;
    --l-blue-bg:#0842a0; --l-blue-fg:#d3e3fd; --l-blue-dot:#7cacf8;
    --l-purple-bg:#4f378b; --l-purple-fg:#eaddff; --l-purple-dot:#b69df8;
    --l-pink-bg:#7d2950; --l-pink-fg:#ffd8e4; --l-pink-dot:#ff8bcb;
    --l-red-bg:#8c1d18; --l-red-fg:#fbd3d0; --l-red-dot:#f28b82;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131314; --surface:#1e1f20; --fg:#e3e3e3; --fg-2:#c4c7c5; --fg-3:#8e918f;
  --line:rgba(255,255,255,.08); --line-2:#444746; --hover:rgba(227,227,227,.08);
  --nav-active:#004a77; --nav-active-fg:#c2e7ff;
  --primary:#a8c7fa; --on-primary:#062e6f; --primary-container:#004a77; --on-primary-container:#c2e7ff;
  --row-read:#1e1f20; --row-unread:#28292b; --row-checked:#0b3a63;
  --row-shadow:inset 1px 0 0 rgba(255,255,255,.12),inset -1px 0 0 rgba(255,255,255,.12),0 1px 3px rgba(0,0,0,.6);
  --search-bg:#282a2c; --search-focus:#303134; --search-shadow:0 1px 3px rgba(0,0,0,.6);
  --cta-shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.3);
  --menu-shadow:0 2px 6px 2px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.6);
  --composer-shadow:0 1px 2px rgba(0,0,0,.6),0 2px 6px 2px rgba(0,0,0,.35);
  --jev-bg:#1c2633; --jev-edge:rgba(168,199,250,.2);
  --review-bg:#3d3013; --review-fg:#ffdf99;
  --star:#f6c344; --nudge:#ffb870; --av-fg:#1f1f1f; --chip-on-fg:#1f1f1f;
  --toast-bg:#e3e3e3; --toast-fg:#1f1f1f; --toast-link:#0b57d0;
  --scrim:rgba(0,0,0,.55); --focus:#a8c7fa; --logo-bg:#2a2f38;
  --tier-P0:#f28b82; --tier-P1:#ffb870; --tier-P2:#7cacf8; --tier-P3:#9aa0a6;
  --l-default-bg:#3c4043; --l-default-fg:#e8eaed; --l-default-dot:#9aa0a6;
  --l-gray-bg:#444746; --l-gray-fg:#e3e3e3; --l-gray-dot:#9aa0a6;
  --l-brown-bg:#5a3a28; --l-brown-fg:#f0dfd6; --l-brown-dot:#c49a83;
  --l-orange-bg:#6e3600; --l-orange-fg:#ffdcc2; --l-orange-dot:#ffb870;
  --l-yellow-bg:#5c4300; --l-yellow-fg:#ffefc2; --l-yellow-dot:#fdd663;
  --l-green-bg:#0f5223; --l-green-fg:#c4eed0; --l-green-dot:#6dd58c;
  --l-blue-bg:#0842a0; --l-blue-fg:#d3e3fd; --l-blue-dot:#7cacf8;
  --l-purple-bg:#4f378b; --l-purple-fg:#eaddff; --l-purple-dot:#b69df8;
  --l-pink-bg:#7d2950; --l-pink-fg:#ffd8e4; --l-pink-dot:#ff8bcb;
  --l-red-bg:#8c1d18; --l-red-fg:#fbd3d0; --l-red-dot:#f28b82;
  color-scheme:dark;
}
.c-default{--lb:var(--l-default-bg);--lf:var(--l-default-fg);--dc:var(--l-default-dot)}
.c-gray{--lb:var(--l-gray-bg);--lf:var(--l-gray-fg);--dc:var(--l-gray-dot)}
.c-brown{--lb:var(--l-brown-bg);--lf:var(--l-brown-fg);--dc:var(--l-brown-dot)}
.c-orange{--lb:var(--l-orange-bg);--lf:var(--l-orange-fg);--dc:var(--l-orange-dot)}
.c-yellow{--lb:var(--l-yellow-bg);--lf:var(--l-yellow-fg);--dc:var(--l-yellow-dot)}
.c-green{--lb:var(--l-green-bg);--lf:var(--l-green-fg);--dc:var(--l-green-dot)}
.c-blue{--lb:var(--l-blue-bg);--lf:var(--l-blue-fg);--dc:var(--l-blue-dot)}
.c-purple{--lb:var(--l-purple-bg);--lf:var(--l-purple-fg);--dc:var(--l-purple-dot)}
.c-pink{--lb:var(--l-pink-bg);--lf:var(--l-pink-fg);--dc:var(--l-pink-dot)}
.c-red{--lb:var(--l-red-bg);--lf:var(--l-red-fg);--dc:var(--l-red-dot)}
.t-P0{--tc:var(--tier-P0)} .t-P1{--tc:var(--tier-P1)} .t-P2{--tc:var(--tier-P2)} .t-P3{--tc:var(--tier-P3)}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.i{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.grow{flex:1}
.muted{color:var(--fg-3)}

/* shell */
.app{position:relative;display:flex;flex-direction:column;height:100%}
.hdr{display:flex;align-items:center;gap:8px;height:64px;padding:8px 16px 8px 12px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;width:200px;flex-shrink:0;color:var(--fg-2);font-size:22px;letter-spacing:-.01em}
.search{display:flex;align-items:center;gap:8px;flex:1;max-width:720px;min-width:0;height:48px;padding:0 6px 0 16px;border-radius:24px;background:var(--search-bg);color:var(--fg-2)}
.search:focus-within{background:var(--search-focus);box-shadow:var(--search-shadow)}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;color:var(--fg);font:inherit;font-size:16px}
.search input::placeholder{color:var(--fg-2)}
.search input::-webkit-search-cancel-button{display:none}
.hdr-r{display:flex;align-items:center;gap:12px;margin-left:auto;padding-left:12px;white-space:nowrap}
.sample{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--fg-2);font-size:12px}
.synced{color:var(--fg-3);font-size:13px}
.body{display:flex;flex:1;min-height:0}
.scrim{position:absolute;inset:0;z-index:35;background:var(--scrim)}

/* nav */
.nav{display:flex;flex-direction:column;width:256px;flex-shrink:0;overflow-y:auto;padding:4px 0 16px;transition:width .2s ease}
.cta{display:inline-flex;align-items:center;align-self:flex-start;gap:12px;height:56px;margin:4px 0 16px 8px;padding:0 24px 0 16px;border-radius:16px;background:var(--primary-container);color:var(--on-primary-container);font-weight:500;white-space:nowrap;transition:box-shadow .15s}
.cta:hover{box-shadow:var(--cta-shadow)}
.ni{display:flex;align-items:center;gap:18px;height:32px;margin-right:16px;padding:0 12px 0 26px;border-radius:0 16px 16px 0;color:var(--fg);white-space:nowrap}
.ni:hover{background:var(--hover)}
.ni.on{background:var(--nav-active);color:var(--nav-active-fg);font-weight:700}
.ni-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cnt{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.cnt.plain{font-weight:400;color:var(--fg-3)}
.ni.on .cnt.plain{color:inherit}
.nh{padding:18px 16px 6px 26px;font-size:16px;font-weight:500;white-space:nowrap}
.lab{color:var(--dc)}
.lab path{fill:currentColor;stroke:none}
.chdot{display:grid;place-items:center;width:20px;height:20px;flex-shrink:0}
.chdot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--l-green-dot)}
.chdot.warn::before{background:var(--l-yellow-dot)}
.app.rail .nav{width:72px}
.app.rail .ni{justify-content:center;width:56px;margin:0 8px;padding:0;border-radius:16px}
.app.rail .ni-l,.app.rail .cnt,.app.rail .nh,.app.rail .cta span{display:none}
.app.rail .cta{padding:0 16px;margin-left:8px}

/* pane */
.pane{display:flex;flex-direction:column;flex:1;min-width:0;margin:0 16px 16px 0;overflow:hidden;border-radius:16px;background:var(--surface)}
.toolbar{display:flex;align-items:center;gap:2px;height:48px;padding:0 8px 0 10px;flex-shrink:0}
.ib{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;flex-shrink:0;color:var(--fg-2)}
.ib:hover{background:var(--hover)}
.ib:disabled{opacity:.38;cursor:default;background:none}
.ib.sm{width:20px;height:40px;border-radius:4px;margin-left:-6px}
.ib.spin .i{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tsep{width:1px;height:20px;margin:0 6px;background:var(--line-2)}
.sel-n{margin-left:8px;color:var(--fg-2);font-size:13px;white-space:nowrap}
.pager{padding:0 8px;color:var(--fg-2);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.box{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:2px;box-shadow:inset 0 0 0 2px var(--fg-3);color:var(--on-primary)}
.box.on,.box.mixed{background:var(--primary);box-shadow:none}
.box .i{stroke-width:2.6}
.ck-all{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%}
.ck-all:hover{background:var(--hover)}
.tabs{display:flex;flex-shrink:0;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabx{position:relative;display:flex;align-items:center;gap:16px;flex:1 1 0;min-width:156px;max-width:256px;height:56px;padding:0 16px;color:var(--fg-2)}
.tabx:hover{background:var(--hover)}
.tabx.on{color:var(--tc)}
.tabx.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--tc)}
.tab-txt{display:grid;min-width:0}
.tab-l{display:flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.newchip{display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:8px;background:var(--tc);color:var(--chip-on-fg);font-size:11px;font-weight:500}
.tab-prev{overflow:hidden;color:var(--fg-3);font-size:12px;white-space:nowrap;text-overflow:ellipsis}
.scroller{flex:1;min-height:0;overflow-y:auto}
.view-title{display:none;padding:12px 16px 4px;color:var(--fg-2);font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);color:var(--fg-2)}
.link{color:var(--primary);font-weight:500}
.link:hover{text-decoration:underline}

/* rows */
.row{position:relative;display:grid;grid-template-columns:20px 20px 20px 196px minmax(0,1fr) 84px;align-items:center;column-gap:12px;min-height:40px;padding:0 16px 0 14px;border-bottom:1px solid var(--line);background:var(--row-read);cursor:pointer}
.row.unread{background:var(--row-unread)}
.row.checked{background:var(--row-checked)}
.row:hover{z-index:1;box-shadow:var(--row-shadow)}
.row.cursor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary)}
.ck,.st{display:inline-grid;place-items:center;width:20px;height:20px}
.st .i{color:var(--fg-3)}
.st.on .i{color:var(--star);fill:var(--star)}
.imp{display:inline-grid;place-items:center;width:20px;height:20px}
.imp path{fill:var(--tc);stroke:none}
.imp.t-P3 path{fill:none;stroke:var(--line-2);stroke-width:1.3}
.av{display:none;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--dc);color:var(--av-fg);font-size:16px;font-weight:500}
.row.checked .av{background:var(--primary);color:var(--on-primary)}
.who{min-width:0;overflow:hidden;color:var(--fg);white-space:nowrap;text-overflow:ellipsis}
.who .n{margin-left:4px;color:var(--fg-3);font-size:12px;font-weight:400}
.row.unread .who,.row.unread .s{font-weight:700}
.subj{display:flex;flex-direction:column;gap:6px;min-width:0;padding:10px 0}
.line1{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
.lbls{display:flex;gap:4px;flex-shrink:0}
.lb{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;background:var(--lb);color:var(--lf);font-size:12px;font-weight:500;white-space:nowrap}
.lb.outline{background:none;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--fg-2);font-weight:400}
.txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--fg)}
.snip{color:var(--fg-2)}
.nudge{color:var(--nudge);font-weight:500}
.att{display:inline-flex;align-items:center;gap:6px;max-width:260px;height:30px;padding:0 12px 0 8px;border-radius:15px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--fg-2);font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;align-self:flex-start}
.att .i{color:var(--l-red-dot)}
.when{color:var(--fg-2);font-size:12px;text-align:right;white-space:nowrap}
.row.unread .when{color:var(--fg);font-weight:700}
.acts{position:absolute;top:0;right:8px;bottom:0;display:none;align-items:center;padding-left:12px;background:inherit}
.row:hover .acts{display:flex}
.row:hover .when{visibility:hidden}
.empty{display:grid;justify-items:center;gap:6px;padding:72px 24px;color:var(--fg-2);text-align:center}
.empty .i{color:var(--fg-3);margin-bottom:6px}
.empty-t{color:var(--fg);font-size:16px}

/* conversation */
.convo{max-width:980px;padding:12px 24px 56px 20px}
.c-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 0 4px 56px}
.c-subj{margin:0;font-size:22px;line-height:1.3;font-weight:400;text-wrap:balance}
.jev{margin:14px 0 10px 56px;padding:14px 16px 12px;border-radius:16px;background:var(--jev-bg);box-shadow:inset 0 0 0 1px var(--jev-edge)}
.jev-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.jev-h .spark{color:var(--primary)}
.jev-h b{font-weight:500}
.jev-brief{max-width:72ch;margin:8px 0 10px}
.sig{display:flex;flex-wrap:wrap;gap:6px}
.sg{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--fg-2);font-size:12.5px;white-space:nowrap}
.sg b{color:var(--fg);font-weight:500}
.sg.risk b{color:var(--l-red-dot)}
.review{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--review-bg)}
.review-t{flex:1 1 240px;color:var(--review-fg);font-weight:500}
.more{margin-top:10px}
.more summary{display:inline-flex;align-items:center;gap:4px;color:var(--primary);font-weight:500;font-size:13px;cursor:pointer;list-style:none;border-radius:4px;padding:2px 4px;margin-left:-4px}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{background:var(--hover)}
.more[open] summary .i{transform:rotate(180deg)}
.ans{display:grid;gap:2px;margin-top:8px}
.ans-row{display:grid;grid-template-columns:150px minmax(0,1fr) 96px 40px;align-items:center;gap:10px;min-height:26px;font-size:13px}
.ans-q{color:var(--fg-2)}

  const last = d.msgs[d.msgs.length - 1];
  d.lastH = last.h; d.lastFrom = last.from;
});
const byId = (id) => deals.find((d) => d.id === id);
const isWaiting = (d) => (d.stage === 'shortlisted' || d.stage === 'talking') && d.lastFrom === 'them';
const live = (d) => d.stage !== 'won' && d.stage !== 'passed';

/* ---------- views = the app's queues ---------- */
const VIEWS = {
  inbox:{label:'Inbox', icon:'inbox', tabs:true, filter:(d) => d.stage === 'new' && !d.snoozed},
  review:{label:'Needs review', icon:'eye', filter:(d) => !!d.review, empty:['Nothing needs a second opinion','Conversations land here when Jev was unsure about a call that would change the priority.']},
  waiting:{label:'Waiting on me', icon:'reply', sort:'oldest', filter:isWaiting, empty:['Nobody is waiting on you','Shortlisted and in-talks conversations where they wrote last show up here, oldest first.']},
  starred:{label:'Starred', icon:'star', filter:(d) => !!d.starred, empty:['No starred conversations','Star a conversation with F, or the star at the start of its row.']},
  snoozed:{label:'Snoozed', icon:'clock', filter:(d) => !!d.snoozed, empty:['Nothing snoozed','Press Z on a conversation to hide it for 3 days.']},
  shortlist:{label:'Shortlisted', icon:'bookmark', filter:(d) => d.stage === 'shortlisted'},
  talking:{label:'In talks', icon:'chat', filter:(d) => d.stage === 'talking'},
  won:{label:'Won', icon:'flag', filter:(d) => d.stage === 'won'},
  passed:{label:'Passed', icon:'archive', filter:(d) => d.stage === 'passed'},
  all:{label:'All conversations', icon:'stack', filter:() => true}
};
const NAV_MAIN = ['inbox','review','waiting','starred','snoozed','shortlist','talking','won','passed','all'];
const TAB_EMPTY = {
  P0:['Nothing needs you right now','Conversations that need an answer in a day or two land here.'],
  P1:['Nothing for this week','Solid opportunities without a pressing deadline land here.'],
  P2:['Nothing worth a look','Plausible but unproven conversations land here.'],
  P3:['Low priority is empty','Fan mail, vendor pitches and noise collect here.']
};
function viewDef(key) {
  if (VIEWS[key]) return VIEWS[key];
  if (key.startsWith('cat-')) {
    const c = key.slice(4).replace(/-/g, '_');
    if (CATS[c]) return {label:CATS[c].label, filter:(d) => d.cat === c};
  }
  if (key.startsWith('ch-')) {
    const ch = CHANNELS.find((x) => slug(x.name) === key.slice(3));
    if (ch) return {label:ch.name, filter:(d) => d.ch.includes(ch.name), empty:ch.warn ? [`Nothing from ${ch.name} yet`, `${ch.warn}, so nothing has synced. Start Bridge and the next sync picks it up.`] : null};
  }
  return null;
}

const state = { view:'inbox', tier:'P0', q:'', open:null, sel:new Set(), cursor:null, listIds:[], listScroll:0, openMsgs:new Set(), expanded:new Set(), undo:null, menuAnchor:null, synced:'Synced 4 min ago' };

/* ---------- time (sample clock: Wed, Nov 18, 3:10 PM) ---------- */
const NOW = new Date(2026, 10, 18, 15, 10);
const at = (h) => new Date(NOW.getTime() - h * 3600e3);
function agoLong(h) {
  if (h < 1) return 'just now';
  if (h < 24) { const n = Math.round(h); return `${n} ${n === 1 ? 'hour' : 'hours'} ago`; }
  const n = Math.round(h / 24); return `${n} ${n === 1 ? 'day' : 'days'} ago`;
}
function listTime(h) {
  const d = at(h);
  if (d.toDateString() === NOW.toDateString()) return d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
}
const fullTime = (h) => `${at(h).toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})} (${agoLong(h)})`;

/* ---------- small renderers ---------- */
const lb = (label, c, extra = '') => `<span class="lb c-${c}${extra}">${esc(label)}</span>`;
const catLb = (d) => lb(CATS[d.cat].label, CATS[d.cat].c);
const box = (st) => `<span class="box${st === 'true' ? ' on' : st === 'mixed' ? ' mixed' : ''}">${st === 'true' ? icon('check', 14) : st === 'mixed' ? icon('dash', 14) : ''}</span>`;
const initial = (s) => s.replace(/^The /, '').charAt(0).toUpperCase();
const pct = (p) => `${Math.round(p * 100)}%`;
function senders(d) {
  const me = d.msgs.some((m) => m.from === 'me');
  const first = d.contact.includes(' ') && d.contact !== d.name ? d.contact.split(' ')[0] : d.contact;
  return me ? `${first}, me` : d.contact;
}

/* ---------- list ---------- */
function currentItems() {
  let list;
  if (state.q.trim()) {
    const q = state.q.trim().toLowerCase();
    list = deals.filter((d) => [d.name, d.contact, d.role, d.subject, d.brief, CATS[d.cat].label, ...d.msgs.map((m) => m.text)].join(' ').toLowerCase().includes(q));
  } else {
    const v = viewDef(state.view) || VIEWS.inbox;
    list = deals.filter(v.filter);
    if (v.tabs) list = list.filter((d) => d.tier === state.tier);
  }
  const oldest = !state.q && (viewDef(state.view) || {}).sort === 'oldest';
  return list.sort(oldest ? (a, b) => b.lastH - a.lastH : (a, b) => a.lastH - b.lastH);
}
function rowHtml(d) {
  const checked = state.sel.has(d.id);
  const lbls = [catLb(d)];
  if (d.review) lbls.push(lb('Needs review', 'yellow'));
  if (d.flags.includes('Scam risk')) lbls.push(lb('Scam risk', 'red'));
  if (d.due && d.due.order && live(d)) lbls.push(`<span class="lb outline">${icon('calendar', 12)}${esc(d.due.when)}</span>`);
  const last = d.msgs[d.msgs.length - 1];
  const snippet = isWaiting(d)
    ? `<span class="nudge">They wrote ${esc(agoLong(d.lastH))}. Reply?</span>`
    : `<span class="snip">${esc(last.text.replace(/\s+/g, ' '))}</span>`;
  const att = d.msgs.find((m) => m.attach);
  const n = d.msgs.length;
  return `<div class="row t-${d.tier}${d.unread ? ' unread' : ''}${checked ? ' checked' : ''}${state.cursor === d.id ? ' cursor' : ''}" data-open="${d.id}" tabindex="0" aria-label="${esc(`${d.unread ? 'Unread, ' : ''}${senders(d)}, ${d.subject}, ${listTime(d.lastH)}`)}">
    <button type="button" class="ck" data-check="${d.id}" role="checkbox" aria-checked="${checked}" aria-label="Select ${esc(d.name)}">${box(String(checked))}</button>
    <button type="button" class="av c-${CATS[d.cat].c}" data-check="${d.id}" aria-label="Select ${esc(d.name)}">${checked ? icon('check', 20) : esc(initial(d.contact))}</button>

/* ---------- conversation ---------- */
function jevCard(d) {

  const [opp, val, cred, urg, pers, reply, money, risk] = d.sig;
  const yn = (x) => (x >= 0.5 ? 'Yes' : 'No');
  const rows = [
    ['Category', CATS[d.cat].label, d.conf, true], ['Real opportunity', yn(opp), opp, true], ['Deal value', VAL[val], val / 4, false],
    ['Sender credibility', CRED[cred], cred / 3, false], ['Urgency', URG[urg], urg / 3, false], ['Written for you', yn(pers), pers, true],
    ['Reply expected', yn(reply), reply, true], ['States terms', yn(money), money, true], ['Scam risk', risk >= 0.5 ? 'Likely' : 'Unlikely', risk, true, 'risk']
  ];
  return `<section class="jev" aria-label="How Jev sorted this">
    <div class="jev-h">${icon('spark', 18).replace('class="i"', 'class="i spark"')}<b>Sorted by Jev</b><span class="lb t-${d.tier}" style="background:var(--tc);color:var(--chip-on-fg)">${TIERS[d.tier].label}</span><span class="muted">Score ${d.score} · ${pct(d.conf)} sure it is ${esc(CATS[d.cat].label.toLowerCase())}</span></div>
    <p class="jev-brief">${esc(d.brief)}</p>
    <div class="sig">
      <span class="sg">Opportunity <b>${yn(opp)}</b></span><span class="sg">Value <b>${VAL[val]}</b></span><span class="sg">Credibility <b>${CRED[cred]}</b></span>
      <span class="sg">Urgency <b>${URG[urg]}</b></span><span class="sg">States terms <b>${yn(money)}</b></span><span class="sg${risk >= 0.5 ? ' risk' : ''}">Scam risk <b>${pct(risk)}</b></span>
    </div>
    ${d.review ? `<div class="review"><span class="review-t">Your call: ${esc(d.review.reason)}.</span>${d.review.options.map((o, i) => `<button type="button" class="pill sm outline" data-settle="${d.id}:${i}">${esc(o.label)}</button>`).join('')}</div>` : ''}
    <details class="more"><summary>All 9 answers ${icon('chevD', 16)}</summary>
      <div class="ans">${rows.map((r) => `<div class="ans-row"><span class="ans-q">${r[0]}</span><span class="ans-a">${esc(r[1])}</span><span class="meter${r[4] ? ' risk' : ''}"><i style="width:${Math.round(r[2] * 100)}%"></i></span><span class="ans-p">${r[3] ? pct(r[2]) : ''}</span></div>`).join('')}</div>
    </details>
  </section>`;
}
function msgFull(d, m, key, isLast) {

function renderConvo() {
  const d = byId(state.open);
  const i = state.listIds.indexOf(d.id);

    }

      <span class="tsep"></span>
      <button type="button" class="ib" data-snooze title="${d.snoozed ? 'Unsnooze' : 'Snooze 3 days'} (Z)" aria-label="${d.snoozed ? 'Unsnooze' : 'Snooze 3 days'}">${icon('clock')}</button>
      <button type="button" class="ib" data-unread title="Mark as unread" aria-label="Mark as unread">${icon('mail')}</button>
      <span class="grow"></span>
      ${i >= 0 ? `<span class="pager"><span class="pager-t">${i + 1} of ${n}</span></span>` : ''}
      <button type="button" class="ib" data-pg="-1" aria-label="Newer conversation"${i <= 0 ? ' disabled' : ''}>${icon('chevL')}</button>
      <button type="button" class="ib" data-pg="1" aria-label="Older conversation"${i < 0 || i >= n - 1 ? ' disabled' : ''}>${icon('chevR')}</button>
    </div>
    <div class="scroller" id="cscroll">
      <div class="convo">
        <div class="c-head">
          <h1 class="c-subj">${esc(d.subject)}</h1>
          ${catLb(d)}${lb(STAGES[d.stage].label, STAGES[d.stage].c)}${d.snoozed ? `<span class="lb outline">${icon('clock', 12)}Snoozed until ${esc(d.snoozed)}</span>` : ''}${d.flags.map((f) => lb(f, f === 'Scam risk' ? 'red' : 'default')).join('')}
          <span class="grow"></span>
          <button type="button" class="ib st${d.starred ? ' on' : ''}" data-star="${d.id}" aria-pressed="${!!d.starred}" aria-label="${d.starred ? 'Remove star' : 'Star'}">${icon('star')}</button>
        </div>
        ${jevCard(d)}
        <div class="thread">${parts.join('')}</div>
        ${d.draft ? `<section class="composer" aria-label="Draft reply">
          <div class="comp-h">${icon('reply', 18)}<b>Draft reply to ${esc(d.contact)}</b><span>· written by the writer model</span></div>
          <div class="comp-body" id="draft-text">${esc(d.draft)}</div>
          <div class="comp-f"><button type="button" class="pill primary" data-copy="${d.id}">${icon('copy', 18)}Copy draft</button><span>Dealflow never sends. Paste it into ${esc(lastCh)} to reply.</span></div>
        </section>` : `<p class="nodraft">No draft for this one. Drafts are written for conversations that score This week or higher.</p>`}
        <div class="keys"><span><kbd>S</kbd>Shortlist</span><span><kbd>T</kbd>In talks</span><span><kbd>W</kbd>Won</span><span><kbd>X</kbd>Pass</span><span><kbd>Z</kbd>Snooze</span><span><kbd>F</kbd>Star</span><span><kbd>J</kbd><kbd>K</kbd>Older, newer</span><span><kbd>U</kbd>Back to list</span></div>
      </div>
    </div>`;
}

/* ---------- nav ---------- */
function renderNav() {
  const inboxUnread = deals.filter((d) => VIEWS.inbox.filter(d) && d.unread).length;
  const count = {
    inbox:[inboxUnread, true], review:[deals.filter(VIEWS.review.filter).length, true], waiting:[deals.filter(isWaiting).length, true],
    shortlist:[deals.filter(VIEWS.shortlist.filter).length, false], talking:[deals.filter(VIEWS.talking.filter).length, false]
  };
  const ni = (key, label, ic, cnt, bold, title) => `<button type="button" class="ni${state.view === key && !state.q ? ' on' : ''}" data-nav="${key}" title="${esc(title || label)}"${state.view === key && !state.q ? ' aria-current="page"' : ''}>${ic}<span class="ni-l">${esc(label)}</span>${cnt ? `<span class="cnt${bold ? '' : ' plain'}">${cnt}</span>` : ''}</button>`;
  const unreadIn = (f) => deals.filter((d) => f(d) && d.unread).length;
  $('#nav').innerHTML = `
    <button type="button" class="cta" data-triage title="Open the first unread conversation, highest priority first">${icon('bolt', 22)}<span>Start triage</span></button>
    ${NAV_MAIN.map((k) => ni(k, VIEWS[k].label, icon(VIEWS[k].icon), count[k] ? count[k][0] : 0, count[k] ? count[k][1] : false)).join('')}
    <div class="nh">Labels</div>
    ${Object.entries(CATS).map(([k, c]) => ni(`cat-${slug(k)}`, c.label, `<span class="c-${c.c}" style="display:inline-flex">${LABEL_SVG}</span>`, unreadIn((d) => d.cat === k), true)).join('')}
    <div class="nh">Channels</div>
    ${CHANNELS.map((ch) => ni(`ch-${slug(ch.name)}`, ch.name, `<span class="chdot${ch.warn ? ' warn' : ''}"></span>`, unreadIn((d) => d.ch.includes(ch.name)), true, ch.warn || ch.name)).join('')}
    <div class="nh"></div>
    ${ni('preferences', 'Settings', icon('gear'), 0, false)}`;
}
function renderSearch() {
  $('#search').innerHTML = `${icon('search')}<input id="q" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations"><button type="button" class="ib" data-clearq aria-label="Clear search" hidden id="qclear">${icon('close')}</button>`;
  const q = $('#q');
  q.addEventListener('input', () => {
    state.q = q.value;

function render() {
  renderNav();
  if (state.open && byId(state.open)) renderConvo();

  }

/* ---------- actions ---------- */
function openConvo(id) {
  const d = byId(id);
  if (!d) return;
  if (!state.open && $('#scroller')) state.listScroll = $('#scroller').scrollTop;
  state.open = id; state.cursor = id; d.unread = false;
  render();
  const c = $('#cscroll'); if (c) c.scrollTop = 0;
}
function backToList() {
  const id = state.open;
  state.open = null;
  render();
  if ($('#scroller')) $('#scroller').scrollTop = state.listScroll;
  const row = id && document.querySelector(`.row[data-open="${id}"]`);
  if (row) row.focus({preventScroll:false});
}
function snapshot(ds) { return ds.map((d) => [d, {stage:d.stage, snoozed:d.snoozed, unread:d.unread, starred:d.starred, cat:d.cat, tier:d.tier, score:d.score, review:d.review}]); }
function restore(snap) { snap.forEach(([d, s]) => Object.assign(d, s)); render(); }
function settleAfter(id, idx) {
  const list = currentItems();
  state.listIds = list.map((x) => x.id);
  if (state.open === id && !state.listIds.includes(id)) {
    const next = list[Math.min(idx, list.length - 1)];
    if (next) { state.open = next.id; state.cursor = next.id; next.unread = false; }
    else state.open = null;
  }
  render();
}
function applyOne(id, fn, msg) {
  const d = byId(id);
  if (!d) return;
  const snap = snapshot([d]);
  const idx = state.listIds.indexOf(id);
  const text = fn(d);
  settleAfter(id, idx);
  toast(text || msg, () => restore(snap));
}
const setStage = (id, stage) => applyOne(id, (d) => { if (d.stage === stage) return `Already ${STAGES[stage].label.toLowerCase()}`; d.stage = stage; return `“${d.name}” moved to ${STAGES[stage].label}`; });
const toggleSnooze = (id) => applyOne(id, (d) => { d.snoozed = d.snoozed ? null : 'Sat, Nov 21'; return d.snoozed ? `Snoozed until ${d.snoozed}` : 'Back in your inbox'; });
function toggleStar(id) {
  const d = byId(id);
  if (!d) return;
  d.starred = !d.starred;
  render();
}
function toggleRead(id) {
  const d = byId(id);
  if (!d) return;
  d.unread = !d.unread;
  render();
  toast(d.unread ? 'Marked as unread' : 'Marked as read');
}
function settleReview(id, i) {
  applyOne(id, (d) => {
    const o = d.review.options[i];
    if (o.category) d.cat = o.category;
    if (o.tier) d.tier = o.tier;
    if (o.score != null) d.score = o.score;
    d.review = null;
    return `Filed as ${CATS[d.cat].label}, ${TIERS[d.tier].label}`;
  });
}
function bulk(kind) {
  const ds = [...state.sel].map(byId).filter(Boolean);
  if (!ds.length) return;
  const snap = snapshot(ds);
  const n = ds.length;
  const word = n === 1 ? 'conversation' : 'conversations';
  let msg;
  if (kind === 'shortlisted' || kind === 'passed') { ds.forEach((d) => { d.stage = kind; }); msg = `${n} ${word} moved to ${STAGES[kind].label}`; }
  else if (kind === 'snooze') { ds.forEach((d) => { d.snoozed = 'Sat, Nov 21'; }); msg = `${n} ${word} snoozed until Sat, Nov 21`; }
  else if (kind === 'read') { ds.forEach((d) => { d.unread = false; }); msg = `${n} marked as read`; }
  else if (kind === 'unread') { ds.forEach((d) => { d.unread = true; }); msg = `${n} marked as unread`; }
  else if (kind === 'star') { ds.forEach((d) => { d.starred = true; }); msg = `${n} starred`; }
  state.sel.clear();
  render();
  toast(msg, () => restore(snap));
}
function selectBy(kind) {
  const items = state.listIds.map(byId);
  const pickers = {all:() => true, none:() => false, read:(d) => !d.unread, unread:(d) => d.unread, starred:(d) => d.starred, unstarred:(d) => !d.starred};
  state.sel = new Set(items.filter(pickers[kind]).map((d) => d.id));
  renderList();
}
function startTriage() {
  state.q = ''; $('#q').value = ''; $('#qclear').hidden = true;
  state.view = 'inbox';
  const pool = deals.filter(VIEWS.inbox.filter);
  state.tier = TIER_IDS.find((t) => pool.some((d) => d.tier === t && d.unread)) || TIER_IDS.find((t) => pool.some((d) => d.tier === t)) || 'P0';
  state.sel.clear();
  const list = currentItems();
  state.listIds = list.map((d) => d.id);
  const first = list.find((d) => d.unread) || list[0];
  toggleNav(false);
  setHash('inbox');
  if (first) openConvo(first.id); else render();
}
function sync(btn) {
  if (btn.classList.contains('spin')) return;
  btn.classList.add('spin');
  setTimeout(() => {
    state.synced = 'Synced just now';
    $('#synced').textContent = state.synced;
    btn.classList.remove('spin');
    toast('Up to date. No new conversations since the last sync.');
  }, 900);
}
function copyDraft(id) {
  const d = byId(id);
  if (!d || !d.draft) return;
  const fail = () => {
    const el = $('#draft-text');
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('Could not copy. The draft is selected, so copy it with your keyboard.');
  };
  try { navigator.clipboard.writeText(d.draft).then(() => toast('Draft copied'), fail); } catch (err) { fail(); }
}
function page(dir) {
  const i = state.listIds.indexOf(state.open);
  const next = state.listIds[i + dir];
  if (i >= 0 && next) openConvo(next);
}
function moveCursor(dir) {
  const ids = state.listIds;
  if (!ids.length) return;
  let i = ids.indexOf(state.cursor);
  i = Math.max(0, Math.min(ids.length - 1, (i < 0 ? -1 : i) + dir));
  state.cursor = ids[i];

  if (syncable) html += `<button type="button" class="pill outline" data-syncch="${id}"${dirty ? ' disabled title="Save your changes first"' : ''}>${icon('sync', 18)}Sync now</button>`;
  html += `</div></form>${resLine(res)}`;
  if (id === 'gmail') html += googlePanel();
  if (id === 'sorting') html += policyPanel();
  if (id === 'linkedin') html += linkedinPanel();
  if (GUIDES[id]) html += `<section class="set-block"><h3>${id === 'linkedin' ? 'How LinkedIn is collected' : 'How to set this up'}</h3><ol class="guide">${GUIDES[id].map((s) => `<li>${esc(s)}</li>`).join('')}</ol></section>`;
  if (id === 'general') html += `<section class="set-block"><h3>Where things live</h3><p class="help wide">Settings are saved to the .env file in the Dealflow folder (readable only by you). The sorting policy is rubric.json. Messages are stored in one database file on this computer. This app only reads: it never sends a message or changes anything in your accounts.</p><div class="set-act"><button type="button" class="pill outline" data-cleardemo>Remove sample conversations</button></div></section>`;
  return html;
}
function renderSettings() {
  const id = SS.section;
  const old = $('#sscroll');
  const keep = old && old.dataset.sec === id ? old.scrollTop : 0;
  $('#pane').innerHTML = `
    <div class="toolbar"><button type="button" class="ib" data-nav="inbox" aria-label="Back to inbox" title="Back to inbox">${icon('back')}</button><h1 class="set-title">Settings</h1></div>
    <div class="tabs set-tabs" role="tablist" aria-label="Settings sections">${SET_SECTIONS.map((s) => {
      const st = setStatus(s.id);
      const word = st.dot === 'bad' ? 'needs attention' : st.dot === 'ok' ? 'connected' : 'not connected';
      return `<button type="button" class="set-tab${s.id === id ? ' on' : ''}" role="tab" aria-selected="${s.id === id}" data-set="${s.id}"${st.dot ? ` aria-label="${esc(`${s.label}, ${word}`)}"` : ''}>${esc(s.label)}${st.dot ? `<span class="sdot ${st.dot}" aria-hidden="true"></span>` : ''}</button>`;
    }).join('')}</div>
    <div class="scroller" id="sscroll" data-sec="${id}"><div class="set-page">
      <p class="set-note">${icon('info', 16)}Example settings with sample values. The buttons show what the app does; nothing here is saved or connected.</p>
      ${sectionBody(id)}
    </div></div>`;
  $('#sscroll').scrollTop = keep;
}
function markDirty(sec) {
  SS.dirty.add(sec);
  const save = document.querySelector(`[data-save="${sec}"]`);
  if (save && !SS.busy) save.disabled = false;
  document.querySelectorAll(`[data-test="${sec}"], [data-test^="${sec}:"]`).forEach((b) => { if (!SS.busy) b.textContent = 'Save and test'; });
  const sync = document.querySelector(`[data-syncch="${sec}"]`);
  if (sync) { sync.disabled = true; sync.title = 'Save your changes first'; }
}
function onSettingsInput(e) {
  const el = e.target;
  if (!(el instanceof Element) || !el.closest('#sscroll')) return;
  const k = el.dataset.key;
  if (!k) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (k.startsWith('pol:')) {
    const [, what, cid] = k.split(':');
    if (what === 'owner') RUBRIC.owner = val;
    else if (what === 'w') { RUBRIC.cats.find((c) => c.id === cid).v = Number(val) / 100; const out = document.getElementById(el.dataset.out); if (out) out.textContent = val; }
    else if (what === 'cut') RUBRIC.tiers[cid] = Number(val);
    else if (what === 'crit') RUBRIC.cats.find((c) => c.id === cid).crit = val;
    SS.policyDirty = true;
    const b = document.querySelector('[data-savepolicy]'); if (b) b.disabled = false;
    return;
  }
  if (k.startsWith('acct:')) {
    const [, kind, slot, role] = k.split(':');
    const saved = ACCTS[kind].find((a) => String(a.slot) === slot);
    const store = saved || (SS.freshVals[`${kind}:${slot}`] = SS.freshVals[`${kind}:${slot}`] || {});
    store[el.type === 'password' ? `typed_${role}` : role] = val;
    markDirty(kind);
    return;
  }
  const [sec, key] = k.split('|');
  const f = FIELDS[sec].find((x) => x.key === key);
  if (f.kind === 'secret') f.typed = val; else f.value = val;
  markDirty(sec);
}
function saveSection(id, thenTest) {
  if (SS.dirty.has(id) || SS.fresh[id] && SS.fresh[id].length || [...SS.removing].some((k) => k.startsWith(`${id}:`))) {
    if (ACCTS[id]) {
      ACCTS[id] = ACCTS[id].filter((a) => !SS.removing.has(`${id}:${a.slot}`));
      ACCTS[id].forEach((a) => ['token', 'password'].forEach((r) => { if (a[`typed_${r}`]) { a.hint = a[`typed_${r}`].slice(-4); delete a[`typed_${r}`]; } }));
      SS.fresh[id].forEach((slot) => {
        const v = SS.freshVals[`${id}:${slot}`] || {};
        const secret = v.typed_token || v.typed_password || '';
        ACCTS[id].push({slot, title:id === 'gmail' ? (v.label || v.address || `Gmail account ${slot}`) : (v.label || `Instagram account ${slot}`), label:v.label || '', userId:v.userId || '', address:v.address || '', hint:secret ? secret.slice(-4) : '', n:0, notSynced:true, google:false});
        delete SS.freshVals[`${id}:${slot}`];
      });
      SS.fresh[id] = [];
      [...SS.removing].forEach((k) => { if (k.startsWith(`${id}:`)) SS.removing.delete(k); });
    }
    FIELDS[id].forEach((f) => { if (f.kind === 'secret' && f.typed) { f.hint = f.typed.slice(-4); f.typed = ''; } });
    SS.dirty.delete(id);
    Object.keys(SS.results).forEach((k) => { if (k === id || k.startsWith(`${id}:`)) delete SS.results[k]; });
    toast('Saved (example only, nothing is written)');
  }
  if (thenTest) { testIt(thenTest); return; }
  renderSettings();
}
function testResult(key) {
  if (key === 'sorting') return {ok:true, msg:'Connected. OpenRouter accepted the key and Jev answered.'};
  if (key === 'email') return {ok:false, msg:'Could not connect to Proton Mail Bridge at 127.0.0.1:1143. Make sure Bridge is running, then test again.'};
  const [kind, slot] = key.split(':');
  const a = ACCTS[kind].find((x) => String(x.slot) === slot);
  if (kind === 'instagram') return a && a.hint ? {ok:true, msg:`Connected as ${a.title}. Messages can be read.`} : {ok:false, msg:'Paste an access token first, then test again.'};
  return a && (a.google || a.hint) ? {ok:true, msg:`${a.google ? 'Signed in as' : 'Connected to'} ${a.address || a.title}. Mail can be read.`} : {ok:false, msg:'Sign in with Google, or enter the address and an app password, then test again.'};
}
function testIt(key) {
  SS.busy = `test:${key}`;
  delete SS.results[key];
  renderSettings();
  setTimeout(() => { SS.busy = ''; SS.results[key] = testResult(key); renderSettings(); }, 800);
}
function settingsClick(el) {
  const tab = el.closest('[data-set]'); if (tab) { SS.section = tab.dataset.set; renderSettings(); return true; }
  const test = el.closest('[data-test]');
  if (test) {
    const key = test.dataset.test;
    const sec = key.split(':')[0];
    const freshKey = key.includes(':') && SS.fresh[sec] && SS.fresh[sec].includes(Number(key.split(':')[1]));
    if (SS.dirty.has(sec) || freshKey) saveSection(sec, key); else testIt(key);
    return true;
  }
  const add = el.closest('[data-addacct]');
  if (add) { const kind = add.dataset.addacct; SS.fresh[kind].push(SS.nextSlot[kind]++); renderSettings(); return true; }
  const rm = el.closest('[data-rmacct]');
  if (rm) {
    const key = rm.dataset.rmacct;
    const [kind, slot] = key.split(':');
    if (rm.dataset.fresh) { SS.fresh[kind] = SS.fresh[kind].filter((s) => String(s) !== slot); delete SS.freshVals[key]; }
    else if (SS.removing.has(key)) SS.removing.delete(key);
    else { SS.removing.add(key); SS.dirty.add(kind); }
    renderSettings();
    return true;
  }
  if (el.closest('[data-google]')) { toast('In the app, this opens Google’s sign-in page, then brings you back here signed in.'); return true; }
  if (el.closest('[data-copyuri]')) {
    const done = () => toast('Redirect URI copied');
    const fail = () => { const i = $('#g-redirect'); i.focus(); i.select(); toast('Could not copy. The address is selected, so copy it with your keyboard.'); };
    try { navigator.clipboard.writeText(REDIRECT_URI).then(done, fail); } catch (err) { fail(); }
    return true;
  }
  const sy = el.closest('[data-syncch]');
  if (sy) { toast(`In the app, this syncs ${SET_SECTIONS.find((s) => s.id === sy.dataset.syncch).label} now.`); return true; }
  if (el.closest('[data-savepolicy]')) {
    SS.policyDirty = false;
    renderSettings();
    toast('Policy saved. Re-sort to apply it to existing conversations.', () => toast(`In the app, this re-sorts all ${deals.length} conversations with Jev.`), 'Re-sort');
    return true;
  }
  if (el.closest('[data-resort]')) { toast(`In the app, this re-sorts all ${deals.length} conversations with Jev.`); return true; }
  if (el.closest('[data-import]')) {
    const f = $('#li-file');
    if (!f || !f.files.length) toast("Choose messages.csv from LinkedIn's export first");
    else toast(`In the app, this imports ${f.files[0].name} and merges it with what Claude collects.`);
    return true;
  }
  if (el.closest('[data-cleardemo]')) { toast('In the app, this removes the sample conversations and keeps your real ones.'); return true; }
  return false;
}
document.addEventListener('input', onSettingsInput);
document.addEventListener('change', onSettingsInput);
document.addEventListener('submit', (e) => {
  const form = e.target instanceof Element && e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  saveSection(form.dataset.form);
});

/* ---------- menu ---------- */
const menu = $('#menu');
function openMenu(anchor) {
  const items = [['all','All'],['none','None'],['read','Read'],['unread','Unread'],['starred','Starred'],['unstarred','Unstarred']];
  menu.innerHTML = items.map(([k, l]) => `<button type="button" class="mi" role="menuitem" data-pick="${k}">${l}</button>`).join('');
  menu.hidden = false;
  const ar = $('#app').getBoundingClientRect();
  const r = anchor.getBoundingClientRect();
  menu.style.top = `${r.bottom - ar.top + 2}px`;
  menu.style.left = `${Math.max(8, r.left - ar.left - 28)}px`;
  state.menuAnchor = anchor;
  menu.querySelector('.mi').focus({preventScroll:true});
}
function closeMenu() {
  if (menu.hidden) return;
  menu.hidden = true;
  const a = state.menuAnchor; state.menuAnchor = null;
  if (a && document.contains(a)) a.focus({preventScroll:true});
}

/* ---------- navigation ---------- */
const isMobile = () => window.matchMedia('(max-width:720px)').matches;
function toggleNav(force) {
  const app = $('#app');
  const open = force == null ? !app.classList.contains('nav-open') : force;
  app.classList.toggle('nav-open', open);
  $('#scrim').hidden = !open;
}
function setHash(key) { try { if (location.hash.slice(1) !== key) location.hash = key; } catch (err) { /* optional */ } }
function goView(key) {
  if (!viewDef(key) && key !== 'preferences') key = 'inbox';
  state.view = key; state.q = ''; state.open = null; state.sel.clear(); state.cursor = null; state.listScroll = 0;
  const q = $('#q'); if (q) { q.value = ''; $('#qclear').hidden = true; }
  toggleNav(false);
  render();
  if ($('#scroller')) $('#scroller').scrollTop = 0;
  setHash(key);
}
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if ((viewDef(h) || h === 'preferences') && (h !== state.view || state.open)) goView(h);
});

/* ---------- events ---------- */
document.addEventListener('click', (e) => {
  const el = e.target instanceof Element ? e.target : null;
  if (!el) return;
  const pk = el.closest('[data-pick]'); if (pk) { const k = pk.dataset.pick; closeMenu(); selectBy(k); return; }
  const mb = el.closest('[data-menu]'); if (mb) { if (!menu.hidden && state.menuAnchor === mb) closeMenu(); else openMenu(mb); return; }
  if (!el.closest('#menu')) closeMenu();
  if (el.closest('[data-undo]')) { runUndo(); return; }
  if (el.closest('#menu-btn')) { if (isMobile()) toggleNav(); else $('#app').classList.toggle('rail'); return; }
  if (el.closest('#scrim')) { toggleNav(false); return; }
  if (el.closest('[data-clearq]')) { state.q = ''; $('#q').value = ''; $('#qclear').hidden = true; render(); $('#q').focus(); return; }
  const ck = el.closest('[data-check]'); if (ck) { const id = ck.dataset.check; state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); renderList(); return; }
  if (el.closest('[data-checkall]')) { state.sel = state.sel.size ? new Set() : new Set(state.listIds); renderList(); return; }
  const sr = el.closest('[data-star]'); if (sr) { toggleStar(sr.dataset.star); return; }
  const ac = el.closest('[data-act]');
  if (ac) {
    const {act, id} = ac.dataset;
    if (act === 'snooze') toggleSnooze(id); else if (act === 'read') toggleRead(id); else setStage(id, act);
    return;
  }
  const bk = el.closest('[data-bulk]'); if (bk) { bulk(bk.dataset.bulk); return; }
  const sy = el.closest('[data-sync]'); if (sy) { sync(sy); return; }
  if (el.closest('[data-triage]')) { startTriage(); return; }
  const tb = el.closest('[data-tier]'); if (tb) { state.tier = tb.dataset.tier; state.sel.clear(); state.cursor = null; renderList(); $('#scroller').scrollTop = 0; return; }
  const nv = el.closest('[data-nav]'); if (nv) { goView(nv.dataset.nav); return; }
  if (el.closest('[data-back]')) { backToList(); return; }
  const stg = el.closest('[data-stage]'); if (stg) { setStage(state.open, stg.dataset.stage); return; }
  if (el.closest('[data-snooze]')) { toggleSnooze(state.open); return; }
  if (el.closest('[data-unread]')) { const d = byId(state.open); d.unread = true; backToList(); toast('Marked as unread'); return; }
  const pg = el.closest('[data-pg]'); if (pg) { page(+pg.dataset.pg); return; }
  const ex = el.closest('[data-expand]'); if (ex) { state.expanded.add(ex.dataset.expand); renderConvo(); return; }
  const mg = el.closest('[data-msg]');
  if (mg) {
    const key = mg.dataset.msg;
    if (mg.classList.contains('collapsed')) { state.openMsgs.add(key); state.openMsgs.delete(`-${key}`); }
    else { state.openMsgs.delete(key); state.openMsgs.add(`-${key}`); }
    const sc = $('#cscroll').scrollTop; renderConvo(); $('#cscroll').scrollTop = sc;
    return;
  }
  const st = el.closest('[data-settle]'); if (st) { const [id, i] = st.dataset.settle.split(':'); settleReview(id, +i); return; }
  const cp = el.closest('[data-copy]'); if (cp) { copyDraft(cp.dataset.copy); return; }
  if (el.closest('#sscroll, .set-tabs') && settingsClick(el)) return;
  const op = el.closest('[data-open]'); if (op) openConvo(op.dataset.open);
});

document.addEventListener('keydown', (e) => {
  if (!menu.hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    const items = [...menu.querySelectorAll('.mi')];
    const i = items.indexOf(document.activeElement);
    items[e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1)].focus();
    e.preventDefault();
    return;
  }
  if (e.key === 'Escape') {
    if (!menu.hidden) { closeMenu(); return; }
    if (e.target.id === 'q') { e.target.blur(); return; }
    if ($('#app').classList.contains('nav-open')) { toggleNav(false); return; }
    if (state.open) backToList();
    return;
  }
  const t = e.target;
  if ((t.matches && t.matches('input, textarea, select')) || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Enter' || e.key === ' ') && t.dataset && t.dataset.msg && !t.matches('button')) { t.click(); e.preventDefault(); return; }
  if (e.key === 'Enter' && t.classList && t.classList.contains('row')) { openConvo(t.dataset.open); e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  if (k === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (state.view === 'preferences' && !state.q && !state.open) return;
  if (k === 'j' || k === 'k') { e.preventDefault(); if (state.open) page(k === 'j' ? 1 : -1); else moveCursor(k === 'j' ? 1 : -1); return; }
  if ((k === 'o' || e.key === 'Enter') && !state.open && state.cursor) { e.preventDefault(); openConvo(state.cursor); return; }
  if (k === 'u' && state.open) { e.preventDefault(); backToList(); return; }
  const target = state.open || state.cursor;
  if (!target) return;
  const map = {s:'shortlisted', t:'talking', w:'won', x:'passed'};
  if (map[k]) { e.preventDefault(); setStage(target, map[k]); return; }
  if (k === 'z') { e.preventDefault(); toggleSnooze(target); return; }
  if (k === 'f') { e.preventDefault(); toggleStar(target); }
});
document.addEventListener('scroll', (e) => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); }, true);
window.addEventListener('resize', () => { closeMenu(); if (!isMobile()) toggleNav(false); });

$('#menu-btn').innerHTML = icon('menu', 22);
$('#gear').innerHTML = icon('gear', 22);
renderSearch();
const start = location.hash.slice(1);
if (viewDef(start) || start === 'preferences') state.view = start;
render();
})();
</script>
